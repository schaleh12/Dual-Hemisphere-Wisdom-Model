name: Publish GitHub Release (Celestriad 1.0)

on:
  push:
    branches:
      - main
    paths:
      - "RELEASE_NOTES.md"
      - "Launch-Setup-Wizard.bat"
      - "Launch-LMFT-Chess.bat"
      - "Launch-LMFT-Bloodmoon.bat"
      - "LMFT-Training/dist/release_manifest.json"
      - "LMFT-Training/dist/lmft-sanctuary-club-v0.1.0-win64.zip"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.2.0"
          RELEASE_TITLE="Celestriad v1.2.0 — Dual-Hemisphere Wisdom Model"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete-asset "$TAG_NAME" Install-And-Run-LMFT-Chess.bat --yes >/dev/null 2>&1 || true
            gh release delete-asset "$TAG_NAME" LMFT-Installer-Wizard.exe --yes >/dev/null 2>&1 || true
            gh release delete-asset "$TAG_NAME" LMFT-Chess.exe --yes >/dev/null 2>&1 || true
            gh release delete-asset "$TAG_NAME" LMFT-Bloodmoon.exe --yes >/dev/null 2>&1 || true
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
            gh release upload "$TAG_NAME" \
              LMFT-Training/dist/lmft-sanctuary-club-v0.1.0-win64.zip \
              LMFT-Training/dist/release_manifest.json \
              Launch-Setup-Wizard.bat \
              Launch-LMFT-Chess.bat \
              Launch-LMFT-Bloodmoon.bat \
              --clobber
          else
            gh release create "$TAG_NAME" \
              LMFT-Training/dist/lmft-sanctuary-club-v0.1.0-win64.zip \
              LMFT-Training/dist/release_manifest.json \
              Launch-Setup-Wizard.bat \
              Launch-LMFT-Chess.bat \
              Launch-LMFT-Bloodmoon.bat \
              --target main \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
