[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmft-architecture"
version = "0.2.0"
description = "Experimental research into persistent, inspectable Language Model Fuzzy Tree architectures"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "deap>=1.4.1",
    "scikit-fuzzy>=0.4.2",
    "networkx>=3.2",
    "chess>=1.10.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "huggingface-hub>=0.25.0",
    "pywebview>=5.0",
    "pydantic>=2.0.0",
    "safetensors>=0.4.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
